name: Build 9xget

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Open Watcom
        uses: open-watcom/setup-watcom@v0
        with:
          version: "2.0"

      - name: Build with build.sh (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Build with build.bat (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9xget-${{ runner.os }}
          path: bin/9xget.exe

